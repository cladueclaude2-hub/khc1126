<html lang="ko">
<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f3f7f5;--card:#fff;--ink:#14201d;--sub:#51625d;--line:#d9e4df;--pine:#1f5a4d;--pine-d:#174339;--mint:#e3f0ea;--on:#fff;--warn:#fff6dc;--warn-ink:#6b4e00;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--card:#18231f;--ink:#eaf2ef;--sub:#a3b5af;--line:#2b3c37;--pine:#6fc3ad;--pine-d:#8fd6c2;--mint:#1f3a33;--on:#0c1a16;--warn:#33290d;--warn-ink:#f0d68a}}
:root[data-theme="dark"]{--bg:#0f1816;--card:#18231f;--ink:#eaf2ef;--sub:#a3b5af;--line:#2b3c37;--pine:#6fc3ad;--pine-d:#8fd6c2;--mint:#1f3a33;--on:#0c1a16;--warn:#33290d;--warn-ink:#f0d68a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:24px;line-height:1.35;margin:4px 0 6px}
.lead{color:var(--sub);margin:0 0 16px;font-size:15px}
.hours{background:var(--mint);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.prog{margin-bottom:18px}

.dots{display:flex;gap:8px;margin-top:10px;font-size:13px;color:var(--sub)}
.dots span{flex:1;display:flex;align-items:center;gap:6px}
.dots i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--line);color:var(--sub);transition:background .3s,color .3s}
.dots .done i,.dots .cur i{background:var(--pine);color:var(--on)}
.dots .cur{color:var(--ink);font-weight:700}
h2{font-size:21px;line-height:1.4;margin:0 0 4px}
.hint{color:var(--sub);font-size:14px;margin:0 0 14px}
.q{animation:in .3s ease both}

.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;margin-top:10px;padding:12px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:500;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.opt small{color:var(--sub);font-weight:400;font-size:13px;display:block}
.opt:hover{border-color:var(--pine)}
.opt[aria-pressed="true"]{border-color:var(--pine);background:var(--mint)}
.opt .chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--on)}
.opt[aria-pressed="true"] .chk{background:var(--pine);border-color:var(--pine)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.main{background:var(--pine);border-color:var(--pine);color:var(--on)}
.btn:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.sum{font-size:14px;color:var(--sub);margin:0 0 4px}
.res{margin-top:14px}
.svc{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px}
.svc h3{margin:0 0 6px;font-size:19px}
.svc .tg{color:var(--sub);font-size:14px;margin:0 0 6px}
.svc p{margin:4px 0}
.note{background:var(--warn);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.tel{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;padding:0 14px;border-radius:10px;background:var(--mint);color:var(--pine-d);font-weight:700;text-decoration:none}
.small{font-size:13px;color:var(--sub)}
footer{margin-top:22px;text-align:center;font-weight:700;font-size:14px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){.fill,.q{transition:none;animation:none}}
</style>
</head>

{t:"모바일 헬스케어",g:"19~64세 계룡시민 중 혈압·혈당·허리둘레·중성지방·HDL 이상 1개 이상 (고혈압·당뇨·이상지질혈증 환자 제외)",d:"스마트워치와 채움건강앱으로 6개월 건강관리, 보건소 3회 방문(혈액검사·신체계측). 스마트폰 필요",tel:["보건소",TEL],f:function(s){return s.res&&(s.age==="a"||s.age==="y")}},

function esc(x){return String(x).replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m]})}
function prog(n){

function opts(list,key,sel){

  var ag=AGES.filter(function(a){return a[0]===st.age})[0][1],rs=RES.filter(function(a){return a[0]===st.res})[0][1];
  var h='<div class="card"><p class="sum">'+esc(ag)+' · '+esc(rs)+'</p><h2>받을 수 있는 서비스 '+list.length+'건</h2>';
  if(st.res==="y0")h+='<div class="note">1년 이상 거주 조건이 있는 서비스는 1년이 지나면 확인할 수 있어요.</div>';
  h+='<div class="nav"><button class="btn" id="back">이전</button><button class="btn main" id="again">다시 확인하기</button></div></div><div class="res">';
  if(!list.length)h+='<div class="svc"><h3>해당되는 서비스가 없습니다</h3><p>해당되는 서비스가 없습니다. 보건소('+TEL+')로 문의해 주세요.</p><a class="tel" href="tel:'+TEL.replace(/-/g,"")+'">보건소 '+TEL+'</a></div>';
  list.forEach(function(v){
    h+='<div class="svc"><h3>'+v.t+'</h3><p class="tg">대상: '+v.g+'</p><p>'+v.d+'</p>'+(v.w?'<div class="note">※ '+v.w+'</div>':'')+'<p class="small">'+NOTE+'</p><a class="tel" href="tel:'+v.tel[1].split("~")[0].replace(/-/g,"")+'">'+v.tel[0]+' '+v.tel[1]+'</a></div>';
  });
  app.innerHTML=h+'</div>';window.scrollTo({top:0,behavior:"smooth"});
}
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="back"){st.step=st.step===4?3:st.step-1;return render()}
  if(b.id==="again"){st={step:1,age:null,res:null,c:{}};return render()}
  if(b.id==="next"){st.step++;return render()}
  var k=b.dataset.k,v=b.dataset.v;if(!k)return;
  if(k==="age"||k==="res"){st[k]=v;render();setTimeout(function(){st.step++;render()},220);return}
  if(v==="none"){st.c={none:true}}else{delete st.c.none;st.c[v]=!st.c[v]}
  render();
});
render();
</script>
</body>
</html>
